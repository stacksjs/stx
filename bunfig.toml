[install]
registry = { url = "https://registry.npmjs.org/", token = "$BUN_AUTH_TOKEN" }
linker = "hoisted"

[test]
# The DOM the components render into, then the two guards the suite needs as a
# whole: a working directory that still exists, and a timeout big enough for a
# test that builds a TypeScript program. See `suite-guards.ts`.
preload = ["./packages/stx/test-utils/happy-dom.ts", "./packages/stx/test-utils/suite-guards.ts"]
