name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Phase 1+2: core packages (blocking) ─────────────────────────────────
  # Publish order is controlled with staged --skip lists: pantry publishes in
  # directory-scan order (effectively arbitrary), and the v0.2.71 release
  # proved the failure mode — the run died rate-limited on an icon package
  # while @stacksjs/stx itself was still unpublished. skip_existing makes the
  # staged re-invocations cheap: already-published packages cost one GET.
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main
        with:
          install: false

      # Stage 1: the framework itself ships first — @stacksjs/stx and
      # bun-plugin-stx are what consumers wait on. Named as explicit paths
      # rather than by skip-listing everything else, so adding a package to
      # packages/ cannot silently enlist it here as well as in Stage 2.
      - name: Publish stx + bun-plugin-stx
        run: pantry publish --npm --access public packages/stx packages/bun-plugin
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Stage 2: everything else — stx-router, sanitizer, desktop, iconify-*,
      # create-stx, components. Runs after Stage 1 so a hiccup in a peripheral
      # package can never block the critical stx publish. @stacksjs/desktop is
      # an OPTIONAL dependency of @stacksjs/stx (lazily imported for native
      # windows) and its npm trusted-publishing has been flaky, which is the
      # other reason the split exists.
      #
      # The two stages are a strict PARTITION. Stage 2 used to re-attempt
      # stx and bun-plugin-stx and rely on the already-published check to skip
      # them, which is a race: npm's trusted publishing stages an upload
      # before the version is readable, so the check saw "not published",
      # tried again, and npm answered `409 Cannot publish over previously
      # staged version`. That fails the job. Worse, it fails it AFTER a
      # release is tagged and most packages are out — and when the loser is
      # bun-plugin-stx, which @stacksjs/stx pins exactly, the published stx is
      # uninstallable until someone re-runs the job. It cost two releases
      # (v0.2.235, v0.2.236) before it was diagnosed, because the first one
      # happened to survive it.
      - name: Publish remaining core packages
        run: pantry publish --npm --access public --skip collections,stx,bun-plugin
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Built and attached to the release rather than uploaded to the store:
      # submission needs a maintainer's Chrome Web Store account, and a token
      # for it is not in this repo. This gets the artifact to a place where the
      # upload is a download-and-drag rather than a local build, and it stamps
      # the manifest version from package.json — it used to be hardcoded, and
      # had drifted far enough that a second submission would have been rejected
      # for a version that did not exceed the published one (stacksjs/stx#1754).
      - name: Package the DevTools extension
        run: bun run package
        working-directory: packages/devtools-extension

      - name: Create GitHub Release
        uses: home-lang/pantry/packages/action@main
        with:
          install: false
          release: true
          release-changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the extension to the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/devtools-extension/stacks-devtools-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Phase 3: icon collections (non-blocking) ────────────────────────────
  # 218 generated @stacksjs/iconify-* packages. npm rate-limits this volume,
  # so the job runs after — and independently of — the core release: a 429
  # storm here can never delay or fail the framework release. skip_existing
  # means a re-run of this job resumes where the rate limit cut it off.
  icons:
    needs: npm
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install

      - name: Setup Pantry
        uses: home-lang/pantry/packages/action@main
        with:
          install: false

      - name: Pre-build icon collections (parallel)
        # Each Bun build is fast (~0.3-1.6s); parallel pre-build makes
        # prepublishOnly a ~50ms no-op per package because build.ts
        # short-circuits on a fresh dist/.
        run: |
          set -e
          ls -d packages/collections/iconify-*/ 2>/dev/null \
            | xargs -P 8 -I {} bash -c 'cd "{}" && bun build.ts' \
            || echo "::warning::Some icon pre-builds failed; pantry will retry via prepublishOnly"

      - name: Publish icon collections
        run: pantry publish --npm --access public --skip bun-plugin,components,config,create-stx,desktop,iconify-core,iconify-generator,markdown,router,sanitizer,stx
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
