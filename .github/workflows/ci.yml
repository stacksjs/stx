name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  native-signing:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pantry-pm/pantry/packages/action@3436eff9cc46cad165a564f30d458963e148294c # v0.11.99
        with:
          version: '0.11.99'
          install: 'false'
          packages: bun.com@1.4.2 git-scm.org@2.53.0
      - run: bun install --frozen-lockfile
      - run: bun test packages/stx/test/native-signing.test.ts

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Provision managed tools through Pantry
        uses: pantry-pm/pantry/packages/action@3436eff9cc46cad165a564f30d458963e148294c # v0.11.99
        with:
          version: '0.11.99'
          install: 'false'
          packages: bun.com@1.4.2 git-scm.org@2.53.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format Check
        run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Provision managed tools through Pantry
        uses: pantry-pm/pantry/packages/action@3436eff9cc46cad165a564f30d458963e148294c # v0.11.99
        with:
          version: '0.11.99'
          install: 'false'
          packages: bun.com@1.4.2 git-scm.org@2.53.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Provision managed tools through Pantry
        uses: pantry-pm/pantry/packages/action@3436eff9cc46cad165a564f30d458963e148294c # v0.11.99
        with:
          version: '0.11.99'
          install: 'false'
          packages: bun.com@1.4.2 git-scm.org@2.53.0

      - name: Use cached node_modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify an installed consumer of the actual package archives
        run: bun run smoke:install

      - name: Unit Test
        run: bun test --preload ./scripts/browser-test-preload.ts packages examples --max-concurrency=1

      - name: Component Tests with Coverage
        working-directory: ./packages/components
        run: bun test --preload ../../scripts/browser-test-preload.ts --coverage

      - name: Integration Tests
        working-directory: ./packages/components
        run: bun test --preload ../../scripts/browser-test-preload.ts test/integration/

  publish-commit:
    needs: [lint, typecheck, test, native-signing]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Provision managed tools through Pantry
        uses: pantry-pm/pantry/packages/action@3436eff9cc46cad165a564f30d458963e148294c # v0.11.99
        with:
          version: '0.11.99'
          install: 'false'
          packages: bun.com@1.4.2 git-scm.org@2.53.0

      - name: Install Dependencies
        run: bun install --frozen-lockfile --force --no-cache

      - name: Build
        run: bun run build

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit './packages/stx' && pantry publish:commit './packages/bun-plugin' && pantry publish:commit './packages/components'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
